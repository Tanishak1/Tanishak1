name: Update animated GitHub analytics
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analytics.py'
      - '.github/workflows/analytics.yml'
permissions:
  contents: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVG from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_analytics.py
      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-analytics.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated GitHub analytics"
            git push
          fi
