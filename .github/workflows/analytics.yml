name: Update animated GitHub analytics
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analytics.py'
      - '.github/workflows/analytics.yml'
permissions:
  contents: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVG from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_analytics.py
      - name: Refresh README image cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import hashlib
          svg = b"".join(Path(p).read_bytes() for p in ("assets/github-analytics.svg", "assets/contribution-graph.svg", "assets/github-trophies.svg"))
          key = hashlib.sha256(svg).hexdigest()[:12]
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          pattern = r'(https://raw\.githubusercontent\.com/Tanishak1/Tanishak1/main/assets/github-analytics\.svg)(?:\?v=[A-Za-z0-9_-]+)?'
          updated, count = re.subn(pattern, lambda m: m.group(1) + '?v=' + key, content)
          if count != 1:
              raise RuntimeError(f"Expected one analytics image URL, found {count}")
          updated = re.sub(r"(assets/(?:contribution-graph|github-trophies)\.svg)(?:\?v=[A-Za-z0-9_-]+)?", lambda m: m.group(1) + "?v=" + key, updated)
          readme.write_text(updated, encoding="utf-8")
          PY
      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-analytics.svg assets/contribution-graph.svg assets/github-trophies.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated GitHub analytics"
            git push
          fi
