<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Live GitHub analytics">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#0a1021"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#33d6ff"/><stop offset="1" stop-color="#9c79ff"/></linearGradient>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#f2f6ff}
    .label{font:600 13px Arial,sans-serif;fill:#9baed2;letter-spacing:1px}
    .num{font:700 39px Arial,sans-serif;fill:#f2f6ff}
    .note{font:12px Arial,sans-serif;fill:#8296bc}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .tile{animation:rise .7s ease-out both}
    @keyframes pulse{50%{opacity:.35}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.pulse,.tile{animation:none}}
  </style>
</defs>
<rect width="900" height="360" rx="22" fill="url(#bg)" stroke="#304166"/>
<rect x="28" y="28" width="6" height="34" rx="3" fill="url(#accent)"/>
<text x="49" y="54" class="title">Tanishak's GitHub Analytics</text>
<circle cx="846" cy="44" r="6" fill="#35e4a0" class="pulse"/>
<text x="819" y="49" class="label" text-anchor="end">AUTO</text>
<g class="tile" style="animation-delay:0ms"><rect x="28" y="84" width="269" height="106" rx="14" fill="#172541" stroke="#2c4267"/><text x="46" y="111" class="label">CONTRIBUTIONS</text><text x="46" y="158" class="num">48</text><text x="279" y="173" class="note" text-anchor="end">2026 year to date</text></g><g class="tile" style="animation-delay:90ms"><rect x="315" y="84" width="269" height="106" rx="14" fill="#172541" stroke="#2c4267"/><text x="333" y="111" class="label">COMMITS</text><text x="333" y="158" class="num">38</text><text x="566" y="173" class="note" text-anchor="end">2026 year to date</text></g><g class="tile" style="animation-delay:180ms"><rect x="602" y="84" width="269" height="106" rx="14" fill="#172541" stroke="#2c4267"/><text x="620" y="111" class="label">PULL REQUESTS</text><text x="620" y="158" class="num">1</text><text x="853" y="173" class="note" text-anchor="end">all time</text></g><g class="tile" style="animation-delay:270ms"><rect x="28" y="203" width="269" height="106" rx="14" fill="#172541" stroke="#2c4267"/><text x="46" y="230" class="label">ISSUES</text><text x="46" y="277" class="num">0</text><text x="279" y="292" class="note" text-anchor="end">all time</text></g><g class="tile" style="animation-delay:360ms"><rect x="315" y="203" width="269" height="106" rx="14" fill="#172541" stroke="#2c4267"/><text x="333" y="230" class="label">STARS</text><text x="333" y="277" class="num">1</text><text x="566" y="292" class="note" text-anchor="end">public owned repos</text></g><g class="tile" style="animation-delay:450ms"><rect x="602" y="203" width="269" height="106" rx="14" fill="#172541" stroke="#2c4267"/><text x="620" y="230" class="label">ACTIVE STREAK</text><text x="620" y="277" class="num">1</text><text x="853" y="292" class="note" text-anchor="end">days</text></g><text x="450" y="344" class="note" text-anchor="middle">Source: GitHub API  •  Year-to-date metrics may exclude private activity  •  Updated 22 Oct 2026, 12:42 UTC  •  Scheduled refresh every 6 hours</text></svg>